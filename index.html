<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マルコフ・コロシアム</title>
    <style>
        :root {
            --line-green: #7493cd;
            --line-header: #2b364a;
            --my-bubble: #85e249;
            --bot-bubble: #ffffff;
            --text-main: #333333;
            --bg-gray: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .app-header {
            background-color: var(--line-header);
            color: white;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
            flex-shrink: 0;
        }

        .header-btn-group {
            display: flex;
            gap: 8px;
        }

        .text-btn {
            background: none;
            border: 1px solid #ffffff66;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        /* 自動会話ON時の目立つデザイン */
        .text-btn.active-run {
            background-color: #ff5a5a;
            border-color: #ff5a5a;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .view {
            display: none;
            flex-grow: 1;
            flex-direction: column;
            height: calc(100% - 56px);
            overflow: hidden;
        }

        .view.active {
            display: flex;
        }

        /* ==================== 1. 一覧画面 ==================== */
        .add-friend-box {
            padding: 15px;
            background-color: var(--bg-gray);
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .add-friend-box input {
            flex-grow: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 0.95rem;
            outline: none;
        }

        .add-btn {
            background-color: #5c7299;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .friend-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        /* グループ用の特別枠行 */
        .group-row {
            background-color: #eaf2ff;
            border-bottom: 2px solid #cbdfff;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .friend-item:active { background-color: rgba(0,0,0,0.05); }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .friend-avatar {
            width: 48px;
            height: 48px;
            background: #eef2f3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            border: 1px solid #ddd;
        }

        .friend-name-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .friend-name { font-weight: bold; color: var(--text-main); font-size: 1rem; }
        .friend-count { font-size: 0.75rem; color: #888; }
        .delete-btn { background-color: #ff5a5a; color: white; border: none; padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; }

        /* ==================== 2. トーク画面共通 ==================== */
        .chat-view {
            background-color: var(--line-green);
        }

        .chat-history {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            max-width: 85%;
        }

        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            margin-right: 8px;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* グループ用に名前ラベルを追加 */
        .bubble-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .bot-name-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            padding-left: 2px;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .bot .bubble { background-color: var(--bot-bubble); color: var(--text-main); border-top-left-radius: 2px; }
        .user .bubble { background-color: var(--my-bubble); color: var(--text-main); border-top-right-radius: 2px; }

        .meta-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            font-size: 0.7rem;
            color: #ffffffcc;
            margin: 0 5px;
            min-width: 35px;
        }
        .user .meta-info { text-align: right; }
        .read-status { color: #e4ffad; font-weight: bold; }

        .chat-input-area {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }

        .chat-input-area textarea {
            flex-grow: 1;
            height: 38px;
            border: 1px solid #ccc;
            border-radius: 19px;
            padding: 9px 15px;
            box-sizing: border-box;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .chat-input-area button {
            background-color: #5c7299;
            color: white;
            border: none;
            width: 55px;
            height: 38px;
            border-radius: 19px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- ==================== 1. ルーム一覧画面 ==================== -->
    <div id="friendView" class="view active">
        <div class="app-header">
            <span>トーク一覧 👥</span>
            <div class="header-btn-group">
                <button class="text-btn" onclick="exportAllData()">バックアップ</button>
                <button class="text-btn" onclick="triggerImport()">復元</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllData(event)">
            </div>
        </div>
        
        <div class="add-friend-box">
            <input type="text" id="newBotName" placeholder="新しいBotを追加" maxlength="15">
            <button class="add-btn" onclick="addBot()">追加</button>
        </div>
        
        <div class="friend-list" id="friendList">
            <!-- JavaScriptで動的に生成 -->
        </div>
    </div>

    <!-- ==================== 2. トーク・グループ共通画面 ==================== -->
    <div id="chatView" class="view">
        <div class="app-header">
            <button class="text-btn" style="font-size: 1rem; padding: 2px 8px;" onclick="backToFriends()">＜ 戻る</button>
            <span id="chatTitle">ルーム名</span>
            <div id="headerGroupControls">
                <!-- グループ用の自動おしゃべり切り替えボタンがここに動的に入る -->
            </div>
        </div>
        
        <div class="chat-history" id="chatHistory">
            <!-- 会話ログ -->
        </div>

        <div class="chat-input-area">
            <textarea id="userInput" placeholder="監視中... (介入発言も可能)" onkeydown="handleKeyDown(event)"></textarea>
            <button onclick="sendMessage()">送信</button>
        </div>
    </div>

</div>

<script>
    // データ構造
    let bots = [];
    let groupChatLog = []; // グループトーク全体の履歴
    
    let currentRoomId = null; // 'group' または 各Botのid
    let autoChatIntervalId = null; // タイマーID

    const avatars = ["🤖", "🐱", "🐶", "🦊", "🐻", "🦁", "🐸", "🐹", "🦄", "🐼"];

    // 起動時の初期化
    function initApp() {
        const localBots = localStorage.getItem('markov_arena_bots');
        const localGroupLog = localStorage.getItem('markov_arena_group_log');
        
        if (localBots) {
            try { bots = JSON.parse(localBots); } catch(e) { bots = []; }
        }
        if (localGroupLog) {
            try { groupChatLog = JSON.parse(localGroupLog); } catch(e) { groupChatLog = []; }
        }

        // 誰もいない場合は初期フレンドを2人用意
        if (bots.length === 0) {
            bots.push({
                id: "bot_1", name: "人間ボットA", avatar: "🤖",
                dict: {}, beginnings: [], count: 0, chatLog: []
            }, {
                id: "bot_2", name: "ねこボットB", avatar: "🐱",
                dict: {}, beginnings: [], count: 0, chatLog: []
            });
            saveToLocalStorage();
        }

        renderRoomList();
    }

    function saveToLocalStorage() {
        localStorage.setItem('markov_arena_bots', JSON.stringify(bots));
        localStorage.setItem('markov_arena_group_log', JSON.stringify(groupChatLog));
    }

    // 画面の一覧描画
    function renderRoomList() {
        const listEl = document.getElementById('friendList');
        listEl.innerHTML = '';

        // 固定枠：AIコロシアム（グループ部屋）
        const groupItem = document.createElement('div');
        groupItem.className = 'friend-item group-row';
        groupItem.onclick = () => openRoom('group');
        groupItem.innerHTML = `
            <div class="friend-info">
                <div class="friend-avatar" style="background:#cbdfff">👥</div>
                <div class="friend-name-box">
                    <div class="friend-name">【AIグループ】全員の部屋</div>
                    <div class="friend-count">参加AI: ${bots.length} 人 (自動会話・相互学習モード)</div>
                </div>
            </div>
            <span style="font-size:0.8rem; color:#5c7299; font-weight:bold; margin-right:8px;">入室</span>
        `;
        listEl.appendChild(groupItem);

        // 個別Bot一覧
        bots.forEach(bot => {
            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => openRoom(bot.id);
            item.innerHTML = `
                <div class="friend-info">
                    <div class="friend-avatar">${bot.avatar}</div>
                    <div class="friend-name-box">
                        <div class="friend-name">${escapeHTML(bot.name)}</div>
                        <div class="friend-count">個別学習回数: ${bot.count} 回</div>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteBot(event, '${bot.id}')">削除</button>
            `;
            listEl.appendChild(item);
        });
    }

    function addBot() {
        const input = document.getElementById('newBotName');
        const name = input.value.trim();
        if (!name) return;

        bots.push({
            id: 'bot_' + Date.now(),
            name: name,
            avatar: avatars[Math.floor(Math.random() * avatars.length)],
            dict: {}, beginnings: [], count: 0, chatLog: []
        });
        saveToLocalStorage();
        input.value = '';
        renderRoomList();
    }

    function deleteBot(event, botId) {
        event.stopPropagation();
        if (!confirm("このBotと会話データを削除しますか？")) return;
        bots = bots.filter(b => b.id !== botId);
        saveToLocalStorage();
        renderRoomList();
    }

    // 部屋に入る
    function openRoom(roomId) {
        currentRoomId = roomId;
        const history = document.getElementById('chatHistory');
        history.innerHTML = '';
        
        const controls = document.getElementById('headerGroupControls');
        controls.innerHTML = '';

        if (roomId === 'group') {
            // === グループ部屋の処理 ===
            document.getElementById('chatTitle').innerText = "AI監視ルーム";
            
            // 自動会話切り替えボタンを設置
            controls.innerHTML = `<button id="autoBtn" class="text-btn" onclick="toggleAutoChat()">自動会話: OFF</button>`;
            
            if (groupChatLog.length === 0) {
                appendSystemMessage("AI同士のグループルームです。右上の「自動会話」をONにすると、Botたちが勝手に話し合って互いの言葉を学習し始めます。");
            } else {
                groupChatLog.forEach(msg => {
                    appendMessageDOM(msg.sender, msg.text, msg.time, msg.senderName, msg.avatar);
                });
            }
        } else {
            // === 個別部屋の処理 ===
            const bot = bots.find(b => b.id === roomId);
            if (!bot) return;
            document.getElementById('chatTitle').innerText = bot.name;
            controls.innerHTML = `<button class="text-btn" onclick="renameBot('${bot.id}')">改名</button>`;

            if (bot.chatLog.length === 0) {
                appendMessageDOM('bot', "こんにちは！あなたの言葉だけで育つボットです。タイマンでお話ししましょう。", getNowTime(), bot.name, bot.avatar);
            } else {
                bot.chatLog.forEach(msg => {
                    appendMessageDOM(msg.sender, msg.text, msg.time, bot.name, bot.avatar);
                });
            }
        }

        document.getElementById('friendView').classList.remove('active');
        document.getElementById('chatView').classList.add('active');
        setTimeout(() => { history.scrollTop = history.scrollHeight; }, 50);
    }

    function backToFriends() {
        // 部屋を出るときは自動会話を必ずOFFにする
        if (autoChatIntervalId) {
            toggleAutoChat();
        }
        document.getElementById('chatView').classList.remove('active');
        document.getElementById('friendView').classList.add('active');
        renderRoomList();
    }

    function renameBot(botId) {
        const bot = bots.find(b => b.id === botId);
        if (!bot) return;
        const n = prompt("新しい名前:", bot.name);
        if (n && n.trim()) {
            bot.name = n.trim();
            document.getElementById('chatTitle').innerText = bot.name;
            saveToLocalStorage();
        }
    }

    // --- 【コア】マルコフ連鎖の学習と生成 ---
    function trainMarkov(bot, text) {
        const trimmed = text.trim();
        if (trimmed.length < 3) return;
        for (let i = 0; i < trimmed.length - 2; i++) {
            const key = trimmed.substring(i, i + 2);
            const nextChar = trimmed.charAt(i + 2);
            if (i === 0 || ['。', '\n', '！', '？', ' ', ' '].includes(trimmed.charAt(i - 1))) {
                bot.beginnings.push(key);
            }
            if (!bot.dict[key]) bot.dict[key] = [];
            bot.dict[key].push(nextChar);
        }
        bot.count++;
    }

    function generateReply(bot) {
        const keys = Object.keys(bot.dict);
        let currentKey = bot.beginnings.length > 0 
            ? bot.beginnings[Math.floor(Math.random() * bot.beginnings.length)]
            : keys[Math.floor(Math.random() * keys.length)];

        let result = currentKey;
        const maxLen = Math.min(50, Math.floor(Math.random() * 20) + 10);

        for (let i = 0; i < maxLen; i++) {
            const nextChoices = bot.dict[currentKey];
            if (!nextChoices || nextChoices.length === 0) break;
            const nextChar = nextChoices[Math.floor(Math.random() * nextChoices.length)];
            result += nextChar;
            if (['。', '！', '？'].includes(nextChar) && i > 6) break;
            currentKey = currentKey.charAt(1) + nextChar;
        }
        return result;
    }

    // --- 【新機能】AI同士の自動会話のON/OFF駆動 ---
    function toggleAutoChat() {
        const btn = document.getElementById('autoBtn');
        if (!btn) return;

        if (autoChatIntervalId) {
            // 停止
            clearInterval(autoChatIntervalId);
            autoChatIntervalId = null;
            btn.innerText = "自動会話: OFF";
            btn.classList.remove('active-run');
        } else {
            // 開始
            if (bots.length < 2) {
                alert("AI同士で会話させるには、Botを最低2人以上作成してください。");
                return;
            }
            btn.innerText = "自動会話: ON";
            btn.classList.add('active-run');
            
            // 2.5秒ごとに誰かが喋るループ
            autoChatIntervalId = setInterval(triggerSingleBotSpeech, 2500);
        }
    }

    // 誰か1人が発言し、他全員がそれを聴いて学習する
    function triggerSingleBotSpeech() {
        if (currentRoomId !== 'group') return;

        // 1. 喋るBotをランダムに決定
        const speakerIndex = Math.floor(Math.random() * bots.length);
        const speaker = bots[speakerIndex];
        
        // 2. そのBotのマルコフ脳から文章を生成
        const speechText = generateReply(speaker);
        const timeStr = getNowTime();

        // 3. 画面に描写 ＆ グループ全体のログに記録
        appendMessageDOM('bot', speechText, timeStr, speaker.name, speaker.avatar);
        groupChatLog.push({
            sender: 'bot', senderName: speaker.name, avatar: speaker.avatar, text: speechText, time: timeStr
        });

        // 4. 【重要】喋った本人「以外」のグループ全員に、この発言を学習させる！！
        bots.forEach((bot, index) => {
            if (index !== speakerIndex) {
                trainMarkov(bot, speechText);
            }
        });

        saveToLocalStorage();
    }

    // ユーザーからのチャット介入（あるいは監視中のつぶやき）
    function sendMessage() {
        const inputEl = document.getElementById('userInput');
        const text = inputEl.value.trim();
        if (!text) return;

        const timeStr = getNowTime();

        if (currentRoomId === 'group') {
            // グループ内でユーザーが発言した場合
            appendMessageDOM('user', text, timeStr, "あなた", "");
            groupChatLog.push({ sender: 'user', senderName: "あなた", avatar: "", text: text, time: timeStr });
            
            // グループの全Botがユーザーの発言を一斉に学習！
            bots.forEach(bot => trainMarkov(bot, text));
        } else {
            // 個別チャットの場合
            const bot = bots.find(b => b.id === currentRoomId);
            if (!bot) return;

            appendMessageDOM('user', text, timeStr, "あなた", "");
            bot.chatLog.push({ sender: 'user', text: text, time: timeStr });
            trainMarkov(bot, text);

            // 個別対話のBotが返答
            setTimeout(() => {
                const rep = generateReply(bot);
                appendMessageDOM('bot', rep, getNowTime(), bot.name, bot.avatar);
                bot.chatLog.push({ sender: 'bot', text: rep, time: getNowTime() });
                saveToLocalStorage();
            }, 600);
        }

        inputEl.value = '';
        saveToLocalStorage();
    }

    // --- メッセージDOM生成ヘルパー ---
    function appendMessageDOM(sender, text, timeStr, nameLabel, avatar) {
        const history = document.getElementById('chatHistory');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;

        let innerHTML = '';
        if (sender === 'bot') {
            innerHTML += `<div class="chat-avatar" style="background:#f0f0f0">${avatar}</div>`;
            innerHTML += `
                <div class="bubble-wrapper">
                    <div class="bot-name-label">${escapeHTML(nameLabel)}</div>
                    <div class="bubble">${escapeHTML(text)}</div>
                </div>
                <div class="meta-info"><span class="time">${timeStr}</span></div>
            `;
        } else {
            innerHTML += `
                <div class="bubble">${escapeHTML(text)}</div>
                <div class="meta-info">
                    <span class="read-status">既読</span>
                    <span class="time">${timeStr}</span>
                </div>
            `;
        }

        msgDiv.innerHTML = innerHTML;
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
    }

    function appendSystemMessage(text) {
        const history = document.getElementById('chatHistory');
        const div = document.createElement('div');
        div.style = "text-align:center; color:rgba(255,255,255,0.8); font-size:0.8rem; margin:10px 20px; background:rgba(0,0,0,0.15); padding:8px; border-radius:8px;";
        div.innerText = text;
        history.appendChild(div);
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function getNowTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function escapeHTML(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // --- バックアップ、復元 ---
    function exportAllData() {
        const pack = { bots: bots, groupLog: groupChatLog };
        const blob = new Blob([JSON.stringify(pack, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `markov_arena_backup.json`;
        a.click();
    }

    function triggerImport() { document.getElementById('importFile').click(); }

    function importAllData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.bots && data.groupLog) {
                    bots = data.bots;
                    groupChatLog = data.groupLog;
                    saveToLocalStorage();
                    renderRoomList();
                    alert("すべてのAIデータとグループ履歴を復元しました！");
                } else { alert("ファイル形式が違います。"); }
            } catch (err) { alert("エラーが発生しました。"); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onload = initApp;
</script>

</body>
</html>
