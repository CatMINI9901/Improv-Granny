<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マルコフ_コロシアム Custom</title>
    <style>
        :root {
            --line-green: #7493cd;
            --line-header: #2b364a;
            --my-bubble: #85e249;
            --bot-bubble: #ffffff;
            --text-main: #333333;
            --bg-gray: #f4f5f7;
            --border-color: #e2e5ec;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        input, textarea {
            user-select: text;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .app-header {
            background-color: var(--line-header);
            color: white;
            padding: 0 16px;
            padding-top: env(safe-area-inset-top, 0px);
            font-size: 1.15rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: calc(60px + env(safe-area-inset-top, 0px));
            flex-shrink: 0;
            z-index: 100;
        }

        .header-btn-group {
            display: flex;
            gap: 8px;
        }

        .text-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 0 12px;
            height: 36px;
            min-width: 44px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-btn:active { background-color: rgba(255, 255, 255, 0.1); }

        .text-btn.active-run {
            background-color: #ff5a5a;
            border-color: #ff5a5a;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .view {
            display: none;
            flex-grow: 1;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .view.active { display: flex; }

        /* ==================== 1. トーク一覧画面 ==================== */
        .add-friend-box {
            padding: 12px 16px;
            background-color: var(--bg-gray);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .avatar-input {
            width: 55px;
            height: 44px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.3rem;
            outline: none;
            background: white;
            flex-shrink: 0;
        }

        .add-friend-box .name-input {
            flex-grow: 1;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .add-btn {
            background-color: #5c7299;
            color: white;
            border: none;
            height: 44px;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .add-btn:active { opacity: 0.8; }

        .friend-list {
            flex-grow: 1;
            overflow-y: auto;
            background-color: white;
            -webkit-overflow-scrolling: touch;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #f2f4f7;
            cursor: pointer;
            min-height: 76px;
        }

        .friend-item:active { background-color: #f9fafb; }

        .group-row { background-color: #f0f5ff; border-bottom: 1px solid #cbdfff; }
        .group-row:active { background-color: #e1ecff; }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-grow: 1;
            overflow: hidden;
        }

        .friend-avatar {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            border: 1px solid #ddd;
            flex-shrink: 0;
            font-weight: bold;
            color: var(--text-main);
            overflow: hidden;
        }

        .friend-name-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .friend-name { font-weight: bold; color: var(--text-main); font-size: 1.05rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .friend-count { font-size: 0.8rem; color: #888; }
        
        .delete-btn { 
            background-color: #ffefef; 
            color: #ff4d4d; 
            border: 1px solid #ffcccc; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: bold;
            cursor: pointer; 
            height: 38px;
            flex-shrink: 0;
        }
        .delete-btn:active { background-color: #ffdddd; }

        /* ==================== 2. チャット画面 ==================== */
        .chat-view { background-color: var(--line-green); }

        .chat-history {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .message { display: flex; align-items: flex-start; max-width: 88%; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            margin-right: 8px;
            flex-shrink: 0;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.05);
            font-weight: bold;
            color: var(--text-main);
            overflow: hidden;
        }

        .bubble-wrapper { display: flex; flex-direction: column; gap: 4px; }
        .bot-name-label { font-size: 0.8rem; color: rgba(255, 255, 255, 0.9); padding-left: 4px; font-weight: bold; }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.45;
            word-break: break-all;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .bot .bubble { background-color: var(--bot-bubble); color: var(--text-main); border-top-left-radius: 2px; }
        .user .bubble { background-color: var(--my-bubble); color: var(--text-main); border-top-right-radius: 2px; }

        .meta-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 6px;
            min-width: 35px;
            flex-shrink: 0;
        }
        .user .meta-info { text-align: right; }
        .read-status { color: #dbff8a; font-weight: bold; font-size: 0.7rem; }

        .chat-input-area {
            background-color: #ffffff;
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 10px;
            align-items: flex-end;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-input-area textarea {
            flex-grow: 1;
            height: 44px;
            max-height: 100px;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 11px 16px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.3;
            background-color: var(--bg-gray);
        }

        .chat-input-area textarea:focus { background-color: #fff; border-color: #5c7299; }
        .chat-input-area button {
            background-color: #5c7299;
            color: white;
            border: none;
            width: 64px;
            height: 44px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .chat-input-area button:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="friendView" class="view active">
        <div class="app-header">
            <span>トーク一覧 👥</span>
            <div class="header-btn-group">
                <button class="text-btn" onclick="exportAllData()">保存</button>
                <button class="text-btn" onclick="triggerImport()">復元</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllData(event)">
            </div>
        </div>
        
        <div class="add-friend-box">
            <input type="text" id="newBotAvatar" class="avatar-input" placeholder="🎨" maxlength="2">
            <input type="text" id="newBotName" class="name-input" placeholder="新しいBotの名前" maxlength="15">
            <button class="add-btn" onclick="addBot()">追加</button>
        </div>
        
        <div class="friend-list" id="friendList">
            </div>
    </div>

    <div id="chatView" class="view">
        <div class="app-header">
            <button class="text-btn" style="font-size: 0.95rem; border: none;" onclick="backToFriends()">＜ 戻る</button>
            <span id="chatTitle">ルーム名</span>
            <div id="headerGroupControls">
                </div>
        </div>
        
        <div class="chat-history" id="chatHistory">
            </div>

        <div class="chat-input-area">
            <textarea id="userInput" placeholder="メッセージを入力" rows="1"></textarea>
            <button onclick="sendMessage()">送信</button>
        </div>
    </div>

</div>

<script>
    let bots = [];
    let groupChatLog = []; 
    let currentRoomId = null; 
    let autoChatIntervalId = null; 

    const avatars = ["🤖", "🐱", "🐶", "🦊", "🐻", "🦁", "🐸", "🐹", "🦄", "🐼", "👽", "👻", "👑", "🔥", "💩"];

    function initApp() {
        const localBots = localStorage.getItem('markov_arena_bots');
        const localGroupLog = localStorage.getItem('markov_arena_group_log');
        
        if (localBots) {
            try { bots = JSON.parse(localBots); } catch(e) { bots = []; }
        }
        if (localGroupLog) {
            try { groupChatLog = JSON.parse(localGroupLog); } catch(e) { groupChatLog = []; }
        }

        if (bots.length === 0) {
            bots.push({
                id: "bot_1", name: "人間ボットA", avatar: "🤖",
                dict: {}, beginnings: [], count: 0, chatLog: []
            }, {
                id: "bot_2", name: "ねこボットB", avatar: "🐱",
                dict: {}, beginnings: [], count: 0, chatLog: []
            });
            saveToLocalStorage();
        }

        const tx = document.getElementById('userInput');
        tx.addEventListener('input', function() {
            this.style.height = '44px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        setRandomAvatarInput();
        renderRoomList();
    }

    function setRandomAvatarInput() {
        document.getElementById('newBotAvatar').value = avatars[Math.floor(Math.random() * avatars.length)];
    }

    function saveToLocalStorage() {
        localStorage.setItem('markov_arena_bots', JSON.stringify(bots));
        localStorage.setItem('markov_arena_group_log', JSON.stringify(groupChatLog));
    }

    function renderRoomList() {
        const listEl = document.getElementById('friendList');
        listEl.innerHTML = '';

        // グループ部屋
        const groupItem = document.createElement('div');
        groupItem.className = 'friend-item group-row';
        groupItem.onclick = () => openRoom('group');
        groupItem.innerHTML = `
            <div class="friend-info">
                <div class="friend-avatar" style="background:#cbdfff; border-color:#9cbfff;">👥</div>
                <div class="friend-name-box">
                    <div class="friend-name">【AIグループ】全員の部屋</div>
                    <div class="friend-count">参加AI: ${bots.length} 人</div>
                </div>
            </div>
            <span style="font-size:0.85rem; color:#5c7299; font-weight:bold; padding-right:4px;">入室</span>
        `;
        listEl.appendChild(groupItem);

        // 個別Bot
        bots.forEach(bot => {
            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => openRoom(bot.id);
            item.innerHTML = `
                <div class="friend-info">
                    <div class="friend-avatar">${escapeHTML(bot.avatar || '🤖')}</div>
                    <div class="friend-name-box">
                        <div class="friend-name">${escapeHTML(bot.name)}</div>
                        <div class="friend-count">学習回数: ${bot.count} 回</div>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteBot(event, '${bot.id}')">削除</button>
            `;
            listEl.appendChild(item);
        });
    }

    function addBot() {
        const nameInput = document.getElementById('newBotName');
        const avatarInput = document.getElementById('newBotAvatar');
        
        const name = nameInput.value.trim();
        let avatar = avatarInput.value.trim();
        
        if (!name) return;
        if (!avatar) avatar = "🤖"; 

        bots.push({
            id: 'bot_' + Date.now(),
            name: name,
            avatar: avatar,
            dict: {}, beginnings: [], count: 0, chatLog: []
        });
        
        saveToLocalStorage();
        nameInput.value = '';
        setRandomAvatarInput(); 
        renderRoomList();
    }

    function deleteBot(event, botId) {
        event.stopPropagation();
        if (!confirm("このBotと会話データを削除しますか？")) return;
        bots = bots.filter(b => b.id !== botId);
        saveToLocalStorage();
        renderRoomList();
    }

    function openRoom(roomId) {
        currentRoomId = roomId;
        const history = document.getElementById('chatHistory');
        history.innerHTML = '';
        const controls = document.getElementById('headerGroupControls');
        controls.innerHTML = '';

        document.getElementById('userInput').style.height = '44px';

        if (roomId === 'group') {
            document.getElementById('chatTitle').innerText = "AI監視ルーム";
            controls.innerHTML = `<button id="autoBtn" class="text-btn" onclick="toggleAutoChat()">自動会話: OFF</button>`;
            
            if (groupChatLog.length === 0) {
                appendSystemMessage("AI同士のグループです。右上の「自動会話」をONにすると、Botたちがそれぞれの学習データを使って勝手に話し合います。（AI同士の相互学習は行われません）");
            } else {
                groupChatLog.forEach(msg => {
                    appendMessageDOM(msg.sender, msg.text, msg.time, msg.senderName, msg.avatar);
                });
            }
        } else {
            const bot = bots.find(b => b.id === roomId);
            if (!bot) return;
            document.getElementById('chatTitle').innerText = bot.name;
            controls.innerHTML = `<button class="text-btn" onclick="editBotSettings('${bot.id}')">設定変更</button>`;

            if (bot.chatLog.length === 0) {
                appendMessageDOM('bot', "こんにちは！タイマンでお話ししましょう。何か話しかけてみてね！", getNowTime(), bot.name, bot.avatar);
            } else {
                bot.chatLog.forEach(msg => {
                    appendMessageDOM(msg.sender, msg.text, msg.time, bot.name, bot.avatar);
                });
            }
        }

        document.getElementById('friendView').classList.remove('active');
        document.getElementById('chatView').classList.add('active');
        setTimeout(() => { history.scrollTop = history.scrollHeight; }, 60);
    }

    function backToFriends() {
        if (autoChatIntervalId) { toggleAutoChat(); }
        document.getElementById('chatView').classList.remove('active');
        document.getElementById('friendView').classList.add('active');
        renderRoomList();
    }

    function editBotSettings(botId) {
        const bot = bots.find(b => b.id === botId);
        if (!bot) return;

        const newName = prompt("新しい「名前」を入力してください:", bot.name);
        if (newName === null) return; 

        const newAvatar = prompt("新しい「アイコン（絵文字や文字を2文字まで）」を入力してください:", bot.avatar);
        if (newAvatar === null) return; 

        if (newName.trim()) bot.name = newName.trim();
        if (newAvatar.trim()) bot.avatar = newAvatar.trim();

        document.getElementById('chatTitle').innerText = bot.name;
        saveToLocalStorage();
    }

    function trainMarkov(bot, text) {
        const trimmed = text.trim();
        if (trimmed.length < 3) return;
        for (let i = 0; i < trimmed.length - 2; i++) {
            const key = trimmed.substring(i, i + 2);
            const nextChar = trimmed.charAt(i + 2);
            if (i === 0 || ['。', '\n', '！', '？', ' ', ' '].includes(trimmed.charAt(i - 1))) {
                bot.beginnings.push(key);
            }
            if (!bot.dict[key]) bot.dict[key] = [];
            bot.dict[key].push(nextChar);
        }
        bot.count++;
    }

    function generateReply(bot) {
        const keys = Object.keys(bot.dict);
        
        let currentKey = bot.beginnings.length > 0 
            ? bot.beginnings[Math.floor(Math.random() * bot.beginnings.length)]
            : keys[Math.floor(Math.random() * keys.length)];

        let result = currentKey;
        const maxLen = Math.min(50, Math.floor(Math.random() * 20) + 10);

        for (let i = 0; i < maxLen; i++) {
            const nextChoices = bot.dict[currentKey];
            if (!nextChoices || nextChoices.length === 0) break;
            const nextChar = nextChoices[Math.floor(Math.random() * nextChoices.length)];
            result += nextChar;
            if (['。', '！', '？'].includes(nextChar) && i > 6) break;
            currentKey = currentKey.charAt(1) + nextChar;
        }
        return result;
    }

    function toggleAutoChat() {
        const btn = document.getElementById('autoBtn');
        if (!btn) return;

        if (autoChatIntervalId) {
            clearInterval(autoChatIntervalId);
            autoChatIntervalId = null;
            btn.innerText = "自動会話: OFF";
            btn.classList.remove('active-run');
        } else {
            if (bots.length < 2) {
                alert("AI同士で会話させるには、Botを最低2人以上作成してください。");
                return;
            }
            btn.innerText = "自動会話: ON";
            btn.classList.add('active-run');
            autoChatIntervalId = setInterval(triggerSingleBotSpeech, 2500);
        }
    }

    // ★修正箇所：AI同士の相互学習（trainMarkov）を完全にカット
    function triggerSingleBotSpeech() {
        if (currentRoomId !== 'group') return;

        const speakerIndex = Math.floor(Math.random() * bots.length);
        const speaker = bots[speakerIndex];
        const speechText = generateReply(speaker);
        const timeStr = getNowTime();

        appendMessageDOM('bot', speechText, timeStr, speaker.name, speaker.avatar);
        groupChatLog.push({
            sender: 'bot', senderName: speaker.name, avatar: speaker.avatar, text: speechText, time: timeStr
        });

        // ここの学習ループを削除しました

        saveToLocalStorage();
    }

    // ★修正箇所：グループ内での発言は、全AIの学習対象から外しました
    function sendMessage() {
        const inputEl = document.getElementById('userInput');
        const text = inputEl.value.trim();
        if (!text) return;

        const timeStr = getNowTime();

        if (currentRoomId === 'group') {
            appendMessageDOM('user', text, timeStr, "あなた", "");
            groupChatLog.push({ sender: 'user', senderName: "あなた", avatar: "", text: text, time: timeStr });
            // グループ内でのユーザー発言時の一斉学習ループを削除しました
        } else {
            const bot = bots.find(b => b.id === currentRoomId);
            if (!bot) return;

            appendMessageDOM('user', text, timeStr, "あなた", "");
            bot.chatLog.push({ sender: 'user', text: text, time: timeStr });
            trainMarkov(bot, text); // 個別部屋のみ学習を実行

            setTimeout(() => {
                const rep = generateReply(bot);
                appendMessageDOM('bot', rep, getNowTime(), bot.name, bot.avatar);
                bot.chatLog.push({ sender: 'bot', text: rep, time: getNowTime() });
                saveToLocalStorage();
            }, 600);
        }

        inputEl.value = '';
        inputEl.style.height = '44px';
        saveToLocalStorage();
    }

    function appendMessageDOM(sender, text, timeStr, nameLabel, avatar) {
        const history = document.getElementById('chatHistory');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;

        let innerHTML = '';
        if (sender === 'bot') {
            innerHTML += `<div class="chat-avatar">${escapeHTML(avatar || '🤖')}</div>`;
            innerHTML += `
                <div class="bubble-wrapper">
                    <div class="bot-name-label">${escapeHTML(nameLabel)}</div>
                    <div class="bubble">${escapeHTML(text)}</div>
                </div>
                <div class="meta-info"><span class="time">${timeStr}</span></div>
            `;
        } else {
            innerHTML += `
                <div class="bubble">${escapeHTML(text)}</div>
                <div class="meta-info">
                    <span class="read-status">既読</span>
                    <span class="time">${timeStr}</span>
                </div>
            `;
        }

        msgDiv.innerHTML = innerHTML;
        history.appendChild(msgDiv);
        history.scrollTop = history.scrollHeight;
    }

    function appendSystemMessage(text) {
        const history = document.getElementById('chatHistory');
        const div = document.createElement('div');
        div.style = "text-align:center; color:rgba(255,255,255,0.9); font-size:0.8rem; margin:10px 16px; background:rgba(0,0,0,0.15); padding:10px; border-radius:10px; line-height:1.4;";
        div.innerText = text;
        history.appendChild(div);
    }

    function getNowTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function escapeHTML(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function exportAllData() {
        const pack = { bots: bots, groupLog: groupChatLog };
        const blob = new Blob([JSON.stringify(pack, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `markov_arena_backup.json`;
        a.click();
    }

    function triggerImport() { document.getElementById('importFile').click(); }

    function importAllData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.bots && data.groupLog) {
                    bots = data.bots;
                    groupChatLog = data.groupLog;
                    saveToLocalStorage();
                    renderRoomList();
                    alert("すべてのAIデータとグループ履歴を復元しました！");
                } else { alert("ファイル形式が違います。"); }
            } catch (err) { alert("エラーが発生しました。"); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onload = initApp;
</script>

</body>
</html>
